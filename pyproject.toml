[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotating-coil-analyzer"
version = "0.2.0"
description = "Python analyzer for CERN accelerator-magnet rotating-coil measurements (FFMM-compatible)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alberto Bellelli" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "ipywidgets>=8.0",
  "ipympl>=0.9",
]

[project.optional-dependencies]
# Eddy-current fits in the GUI "Physics Plots" tab and in the companion
# analysis repos. Everything else works without it.
eddy = [
  "tools-for-data-analysis @ git+https://gitlab.cern.ch/albellel/tools-for-data-analysis.git",
]
# PowerPoint helpers in rotating_coil_analyzer.presentation
pptx = ["python-pptx>=0.6", "Pillow>=9"]
dev = ["pytest>=7"]

[project.scripts]
rca-analyze = "rotating_coil_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.package-data]
# bundled demo/test data (FCC-ee quadrupole DC run, measurement-head CSV)
"rotating_coil_analyzer.tests" = ["data/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rotating_coil_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["rotating_coil_analyzer/tests"]
